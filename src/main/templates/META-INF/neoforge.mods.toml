license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

description='''
Hand carts, horse-drawn carts, and wagons -- player-pushed and animal-drawn vehicles for hauling
cargo and passengers. See context/design-document.md for the full design.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Nuclyus is the suite's foundation mod -- required (not optional) for every mod, starting with the
# cross-mod menu-contribution system (see Nuclyus' own CLAUDE.md).
[[dependencies.${mod_id}]]
    modId="nuclyus"
    type="required"
    reason="Foundation mod for shared base classes/contracts across the suite."
    ordering="AFTER"
    side="BOTH"

# Optional -- contributes a ready-to-place Hand Cart item into Kyt's mod-managed "Dev" Kyt if Kyt is
# present; this mod works standalone without it.
[[dependencies.${mod_id}]]
    modId="kyt"
    type="optional"
    reason="Contributes Caryvan's Hand Cart debug item into Kyt's mod-managed Dev Kyt."
    ordering="AFTER"
    side="BOTH"

# Optional -- Phase 2's animal-drawn carts reuse Lyfe's Summoning Stone companion-upkeep mechanic
# for their mount slot(s). A Lyfe-less server just leaves every mount slot permanently unfillable
# (see context/design-document.md Section 5's own note); Hand Cart (Phase 1) is unaffected either way.
[[dependencies.${mod_id}]]
    modId="lyfe"
    type="optional"
    reason="Animal-drawn carts summon their mount(s) via Lyfe's Summoning Stone mechanic."
    ordering="AFTER"
    side="BOTH"

# Optional -- Wagon/Carriage Pick Up spills cargo through Yconomics' real Loot Bag mechanic instead
# of plain ground drops when Yconomics is present. A Yconomics-less server just falls back to plain
# vanilla item drops (see entity.AbstractDamageableDrawnInventoryEntity#dumpCargoOnPickUp).
[[dependencies.${mod_id}]]
    modId="yconomics"
    type="optional"
    reason="Wagon/Carriage Pick Up spills cargo into a real Yconomics Loot Bag instead of plain ground drops."
    ordering="AFTER"
    side="BOTH"
