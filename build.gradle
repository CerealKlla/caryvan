plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Wires Minecraft/NeoForge onto the src/test/java classpath so JUnit tests can reference
    // vanilla/NeoForge classes.
    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

    // Nuclyus is a required foundation dependency (see neoforge.mods.toml) -- hard-imported by
    // every mod in the suite for shared base classes/contracts. Sibling repo, not published
    // anywhere -- run ../Nuclyus's own build (or the suite's sync-mods.sh) at least once before
    // building this project.
    compileOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")
    testCompileOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")
    testRuntimeOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")

    // Optional soft dependency -- contributes a ready-to-place Hand Cart into Kyt's mod-managed Dev
    // Kyt, gated behind ModList.get().isLoaded("kyt") in CaryvanMod. Same pattern Blueprynts/
    // Settlemynts already use for their own Dev Kyt contributions.
    compileOnly files("../Kyt/build/libs/kyt-${kyt_version}.jar")

    // Lyfe is an optional soft dependency (see neoforge.mods.toml) -- Phase 2's animal-drawn carts
    // reuse Lyfe's Summoning Stone companion-upkeep mechanic (see bridge.LyfeSummoningBridge),
    // gated behind ModList.get().isLoaded("lyfe") at runtime, same isolation pattern as Kyt above.
    compileOnly files("../Lyfe/build/libs/lyfe-${lyfe_version}.jar")

    // Yconomics is an optional soft dependency (see neoforge.mods.toml) -- the Wagon/Carriage
    // health system's Pick Up action routes spilled cargo through Yconomics' own real
    // bag.LootBagListener#depositOrScatter (see bridge.YconomicsLootBagBridge), gated behind
    // ModList.get().isLoaded("yconomics") at runtime, same isolation pattern as Lyfe above.
    compileOnly files("../Yconomics/build/libs/yconomics-${yconomics_version}.jar")

    // Plain JUnit 5 for pure logic tests (no live server/registry needed, so ModDevGradle's
    // neoForge { unitTest {} } FML-bootstrap machinery isn't required for those).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
